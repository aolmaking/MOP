name: CI

# Runs on every push and PR so a broken build/test/lint never lands on main
# unnoticed -- the old project had no CI at all.
on:
  push:
    # The launch fleet integrates on `develop` and works on `track/*`;
    # CI that only watched `main` would go quiet for exactly the weeks
    # it matters most.
    branches: [main, develop, "track/**", "infra/**"]
  pull_request:

# A quick second push should cancel the run it supersedes rather than
# queue behind it -- during integration windows the queue is the
# bottleneck, not the runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # A real Postgres instance, not a mock -- the integration tests
    # (auth, operation events, access layers) run real Prisma queries
    # against it, matching how they're run locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mop_dev
          POSTGRES_PASSWORD: mop_dev_secret
          POSTGRES_DB: mop_platform_test
          # Pinned, not inherited. 64 columns carry `@default(now())`,
          # which Postgres casts through the *session* timezone on the
          # way into a `timestamp without time zone` column: on a non-UTC
          # server those land in local time while values written by the
          # application land in UTC, and every duration and date bucket
          # that mixes them is silently off by the offset. This image
          # happens to default to UTC, so today the pin changes nothing
          # -- which is the point. It stops CI from quietly agreeing with
          # a differently-configured server later.
          TZ: UTC
          PGTZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mop_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Matches .env.test -- kept as an explicit job-level var rather than
      # relying on Prisma's own .env discovery, since that discovery is
      # relative to the schema file's location, not the repo root (this
      # tripped up the very first local migration run too).
      DATABASE_URL: postgresql://mop_dev:mop_dev_secret@localhost:5432/mop_platform_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          # @angular/cli 22 requires Node >=22.22.3, >=24.15.0, or
          # >=26.0.0 -- 20 (this job's pin until the Angular upgrade that
          # introduced the requirement) fails at "ng test" with a version
          # error, not a real test failure. Matches .nvmrc.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # @mop/shared is consumed through its built dist, so it must exist
      # before anything typechecks, lints or tests against it. The root
      # scripts also do this themselves; having it as its own step means a
      # failure here reports as "shared did not build" rather than as a
      # confusing wall of "Cannot find module @mop/shared".
      - name: Build shared package
        run: pnpm build:shared

      # Uses the same script a developer runs locally, so the two paths
      # cannot drift. tools/with-env.mjs never overrides an already-set
      # variable, so the job-level DATABASE_URL above still wins.
      - name: Apply database migrations
        run: pnpm db:deploy

      # Includes tools/lint-audit-boundary.mjs -- fails the build if any
      # AuditLog write happens outside apps/api/src/audit/**.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The three suites the root `pnpm test` chains, spelled out as
      # separate steps for two reasons. Machine-readable results have to
      # be requested per runner. And the root script chains with `&&`, so
      # one red package means the later ones never run and their state is
      # simply unknown -- which is how the Day-1 baseline nearly went
      # recorded without the web suite in it at all. `if: always()` means
      # a red API suite no longer hides whether web is passing.
      #
      # Same commands, same order, `build:shared` already done above.
      - name: Test — shared
        id: test_shared
        run: pnpm --filter @mop/shared test -- --ci --json --outputFile="$RUNNER_TEMP/results-shared.json"

      - name: Test — api
        id: test_api
        if: always() && steps.test_shared.conclusion != 'cancelled'
        run: pnpm --filter @mop/api test -- --ci --json --outputFile="$RUNNER_TEMP/results-api.json"

      # No JSON for web: its builder writes the report through the *first*
      # configured reporter only, so asking for JSON here would replace
      # the human-readable log rather than accompany it. The two Jest
      # suites are the ones worth capturing anyway.
      - name: Test — web
        id: test_web
        if: always() && steps.test_shared.conclusion != 'cancelled'
        run: pnpm --filter @mop/web test

      # Uploaded on failure too -- a red run is exactly when the detail is
      # worth having, and reading it beats re-reading a truncated log.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results-${{ github.run_id }}
          path: ${{ runner.temp }}/results-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build
        run: pnpm build
