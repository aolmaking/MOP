# Served by apps/web/Dockerfile's runtime stage.
#
# Two responsibilities: SPA fallback (any path that isn't a real static
# file resolves to index.html, so Angular's own router handles it -- a
# plain nginx would 404 on a deep link like /branch/work-orders/abc) and
# proxying /api/ to the NestJS service, since AuthStore and every API
# client in this app call bare relative paths like `/api/v1/auth/me` --
# same-origin is what makes the session's httpOnly cookie usable without
# a CORS/credentials dance in production.
#
# `api` is assumed to be this service's DNS name on whatever orchestrates
# the two containers (a docker-compose service name, a Kubernetes Service)
# -- change it to match wherever this is actually deployed; this file was
# not written against a specific target, see the Dockerfile's own caveat.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
