<div class="mop-toast-stack" role="status" aria-live="polite">
  @for (toast of toasts(); track toast.id) {
    <div class="mop-toast" [class]="'mop-toast--' + toast.tone">
      <span>{{ toast.message }}</span>
      <button type="button" class="mop-toast-dismiss" (click)="dismiss(toast.id)" aria-label="Dismiss">&times;</button>
    </div>
  }
</div>
