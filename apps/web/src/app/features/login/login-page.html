<div class="login-page">
  <div class="login-card">
    <h1>MOP Product Platform</h1>
    <p class="login-subtitle">Sign in to your workshop</p>

    <app-error-banner [error]="error()" (dismissed)="error.set(null)" />

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <p class="field-error">Enter a valid email address.</p>
      }

      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <p class="field-error">Password is required.</p>
      }

      <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <a class="register-link" routerLink="/register">New customer? Create an account</a>
  </div>
</div>
