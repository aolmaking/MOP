<div class="rail-shell">
  <nav class="rail" aria-label="Platform navigation">
    <div class="rail-brand">MOP</div>

    @for (item of navigation; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="rail-link--active" class="rail-link">
        <svg class="rail-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path [attr.d]="item.icon" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ item.label }}
      </a>
    }

    <div class="rail-footer">
      @if (session(); as s) {
        <div class="rail-account">
          <span class="rail-account-name">{{ s.displayName }}</span>
          <span class="rail-account-role">Platform Super Admin</span>
        </div>
        <button type="button" appButton variant="ghost" size="small" (click)="logout()">Log out</button>
      }
    </div>
  </nav>

  <main class="rail-content">
    <router-outlet />
  </main>
</div>

<app-toast-container />
