<div class="tech">
  <header class="tech-head">
    <span class="tech-brand" [title]="branding.activeWorkshop().name">{{ branding.activeWorkshop().name }}</span>
    @if (session(); as s) {
      <span class="tech-who">{{ s.displayName }}</span>
    }
    <div style="margin-left: auto;">
      <app-theme-toggle />
    </div>
  </header>

  <main class="tech-content">
    <router-outlet />
  </main>
</div>

<app-toast-container />
